services:
  catalog-service:
    build:
      context: .
      dockerfile: services/catalog-api/catalog-service/Dockerfile
    ports:
      - "8080:8080"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "3000:3000"
    environment:
      # Set this to a URL reachable from the browser/client as appropriate.
      NEXT_PUBLIC_CATALOG_API_URL: ${NEXT_PUBLIC_CATALOG_API_URL:-http://localhost:8080}
    depends_on:
      - catalog-service
